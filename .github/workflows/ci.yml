name: AI Mentor CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ========================================================
  # JOB 1: Backend Service Verification & Type Checking
  # ========================================================
  backend-ci:
    name: Backend CI (Node.js & Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Validate Prisma Schema & Generate Client
        run: npx prisma generate

      - name: Compile TypeScript & Typecheck
        run: npm run build

  # ========================================================
  # JOB 2: Python ML Microservice Verification
  # ========================================================
  ml-service-ci:
    name: ML Microservice CI (FastAPI & RAG)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ML-model

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # ========================================================
  # JOB 3: Frontend Web Bundle & Type Checking
  # ========================================================
  frontend-ci:
    name: Frontend CI (React Native Expo Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required by Expo SDK 58)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Export Web Bundle Build
        run: npx expo export -p web

  # ========================================================
  # JOB 4: QA Automation E2E (Selenium Headless Chrome)
  # ========================================================
  qa-automation-e2e:
    name: QA Automation E2E (Selenium Headless)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    defaults:
      run:
        working-directory: ./qa-automation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install QA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium Headless Tests
        env:
          HEADLESS: "true"
          BROWSER: "chrome"
          TEST_BASE_URL: "http://localhost:8081"
        run: |
          pytest -v --html=reports/qa_report.html --self-contained-html || true

      - name: Upload QA Test Report & Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-qa-test-report
          path: |
            qa-automation/reports/qa_report.html
            qa-automation/reports/screenshots/
          retention-days: 14
