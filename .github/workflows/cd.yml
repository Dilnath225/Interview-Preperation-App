name: AI Mentor CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ========================================================
  # BUILD & PUSH DOCKER IMAGES
  # ========================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: backend
            context: ./backend
            image: ai-mentor-backend
          - name: ml-model
            context: ./ML-model
            image: ai-mentor-ml
          - name: frontend
            context: ./frontend
            image: ai-mentor-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # DEPLOY TO KUBERNETES
  # ========================================================
  deploy-k8s:
    name: Kubernetes Deployment Validation
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate Kubernetes Manifests (Dry Run)
        run: |
          kubectl apply --dry-run=client --validate=false -f k8s/configmap.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/postgres.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/chromadb.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/backend.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/ml-model.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/frontend.yaml
          kubectl apply --dry-run=client --validate=false -f k8s/ingress.yaml
          echo "✅ All Kubernetes manifests passed client-side validation!"
