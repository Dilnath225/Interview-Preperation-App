apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-mentor-backend
  namespace: default
  labels:
    app: ai-mentor-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-mentor-backend
  template:
    metadata:
      labels:
        app: ai-mentor-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-username/ai-mentor-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: ai-mentor-config
            - secretRef:
                name: ai-mentor-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-mentor-backend
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: ai-mentor-backend
