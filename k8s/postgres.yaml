apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-mentor-postgres
  namespace: default
  labels:
    app: ai-mentor-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-mentor-postgres
  template:
    metadata:
      labels:
        app: ai-mentor-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-mentor-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "ai_mentor_db"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-mentor-postgres
  namespace: default
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: ai-mentor-postgres
