apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-mentor-frontend
  namespace: default
  labels:
    app: ai-mentor-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-mentor-frontend
  template:
    metadata:
      labels:
        app: ai-mentor-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-username/ai-mentor-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-mentor-frontend
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: ai-mentor-frontend
